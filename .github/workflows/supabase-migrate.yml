name: Migrate owned Supabase project

on:
  push:
    branches:
      - agent/facebook-live-page
    paths:
      - '.github/workflows/supabase-migrate.yml'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      action:
        description: "Choose how far to go"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply-schema
          - apply-schema-and-functions

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: epjkfkvisvcgytjjuqaq
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_nD12aO9f5X-J2Cu5xEdndw_JBpietKH

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link new Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview database migrations
        run: supabase db push --dry-run

      - name: Apply database migrations
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'apply-schema' || inputs.action == 'apply-schema-and-functions') }}
        run: supabase db push

      - name: Deploy all Edge Functions manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply-schema-and-functions' }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Facebook livestream function
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Deploy Facebook livestream function' }}
        run: supabase functions deploy facebook-live-status --project-ref "$SUPABASE_PROJECT_ID"

      - name: Check Facebook secret presence
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Check Facebook secret presence' }}
        run: |
          if supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" | grep -q 'FACEBOOK_PAGE_ACCESS_TOKEN'; then
            echo 'FACEBOOK_PAGE_ACCESS_TOKEN is present in the new Supabase project.'
          else
            echo 'FACEBOOK_PAGE_ACCESS_TOKEN is missing from the new Supabase project.'
            exit 1
          fi

      - name: Test Facebook livestream function
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Deploy Facebook livestream function' }}
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/facebook-live-status")
          echo "$response"
          echo "$response" | grep -q '"configured":true'
