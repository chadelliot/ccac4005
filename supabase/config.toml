# Authenticated functions spend metered third-party quota on behalf of members.
[functions.geocode-address]
verify_jwt = true

[functions.program-ai]
verify_jwt = true

# Public endpoints for the Bishop's engagement booking system. Neither exposes
# anything private: availability answers busy/free without naming the engagement,
# and submit is the only write path into bishop_booking_requests (the table
# grants anon nothing, so this function's service role is the gate). Both do
# their own validation and rate limiting.
[functions.bishop-availability]
verify_jwt = false

[functions.bishop-booking-submit]
verify_jwt = false

# Desk action. verify_jwt only proves the caller is signed in, so the function
# additionally checks bishop_booking_authorized_users before writing anything.
[functions.bishop-booking-accept]
verify_jwt = true

# Public, read-only feed of the Page's recent posts for the homepage hero.
# Returns only what is already public on the Page; the token stays server-side.
[functions.facebook-recent-posts]
verify_jwt = false

# Public, read-only Instagram feed for the homepage row. Reads through the
# linked Facebook Page using the same token; no separate Instagram credential.
[functions.instagram-recent-posts]
verify_jwt = false

# Public, read-only. Facebook Page events, read live rather than imported, so
# there is no sync job to fall behind and nothing to reconcile when an event is
# edited or deleted on Facebook.
[functions.facebook-events]
verify_jwt = false

# Public read-only status endpoint used by ccacbmore.com/live. The Facebook Page
# access token remains server-side in Supabase secrets; the function only returns
# public video URLs and live/offline status.
[functions.facebook-live-status]
verify_jwt = false
